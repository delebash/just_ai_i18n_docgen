<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy is delivered as response headers by Tauri's
      webview (configured in src-tauri/tauri.conf.json). A meta-tag CSP
      here would override those headers and break the IPC bridge.
    -->
    <title>Just AI i18n &amp; Docgen</title>
    <!-- First-paint boot layer (JW pattern, adopted 2026-08-04) — the SAME plate
         App.vue's splash renders, shown before the JS bundle parses, so boot is ONE
         continuous image: static plate → Vue splash → shell. The spinner that lived
         here was a second, unrelated splash. KEEP the image + fit IN SYNC with
         App.vue's .splash / styles.css .splash__plate. -->
    <style>
      #app-boot { position: fixed; inset: 0; background: #f7f3ea; }
      #app-boot img {
        position: absolute; inset: 0; width: 100%; height: 100%;
        object-fit: cover; object-position: center top;
      }
      @media (prefers-color-scheme: dark) {
        #app-boot { background: #1d2126; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-boot"><img src="./src/assets/images/splash-plate.jpg" alt="" /></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
