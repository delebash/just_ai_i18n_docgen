<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Content Security Policy is delivered as response headers by Tauri's
      webview (configured in src-tauri/tauri.conf.json). A meta-tag CSP
      here would override those headers and break the IPC bridge.
    -->
    <title>Just AI i18n &amp; Docgen</title>
    <!-- First-paint boot screen (JV/JW pattern) — shown instantly, before the JS
         bundle parses and Vue mounts, so boot is never a blank window. The colours
         match the splash plate's paper + navy; App.vue's splash overlay (the plate
         itself) takes over on mount. -->
    <style>
      #app-boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #f7f3ea; color: #6b7280;
        font: 500 14px/1.4 ui-sans-serif, system-ui, "Segoe UI", sans-serif;
        letter-spacing: 0.02em;
      }
      #app-boot .app-boot__spin {
        width: 30px; height: 30px; border-radius: 50%;
        border: 3px solid rgba(30, 41, 90, 0.12); border-top-color: #27306e;
        animation: app-boot-spin 0.8s linear infinite;
      }
      @keyframes app-boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #app-boot { background: #1d2126; color: #8a8a8a; }
        #app-boot .app-boot__spin { border-color: rgba(255, 255, 255, 0.12); border-top-color: #818cf8; }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="app-boot">
        <div class="app-boot__spin"></div>
        <div>Just AI i18n DocGen</div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
